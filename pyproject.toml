[project]
name = "price-tracker"
version = "0.1.0"
description = "Telegram-бот для отслеживания цен на товары на российских маркетплейсах"
requires-python = ">=3.11"
dependencies = [
    "nodriver>=0.50.3",
    "aiosqlite==0.20.0",
    "apscheduler==3.10.4",
    "python-telegram-bot[socks]>=20.7",
    "python-dotenv==1.0.1",
    "fabric==3.2.3",
    "pymorphy3==2.0.6",
    "pymorphy3-dicts-ru",
    "rapidfuzz==3.14.6",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
